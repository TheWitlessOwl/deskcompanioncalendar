<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desk Companion events</title>
<style>
  :root { --bg:#fdf6e3; --card:#fff; --text:#333; --muted:#7a7a72; --accent:#2b8a6e; --soft:#d6eee5; --line:#ece5d2; --danger:#b3412f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1d211f; --card:#272c29; --text:#ece9df; --muted:#9a9d94; --accent:#5cc4a3; --soft:#2f4a40; --line:#3a413d; --danger:#e08a78; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding:max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); max-width:560px; margin-inline:auto; }
  h1 { font-size:1.4rem; margin:0 0 14px; }
  h2 { font-size:1rem; margin:22px 0 8px; color:var(--muted); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; }
  input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; gap:10px; } .row > div { flex:1; min-width:0; }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; }
  button.plain { background:none; color:var(--muted); padding:6px 10px; font-weight:500; }
  button.del { background:none; color:var(--danger); padding:6px 8px; font-weight:500; }
  .add { width:100%; margin-top:16px; }
  .day { font-weight:600; margin:16px 0 6px; }
  .ev { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:6px; }
  .ev.past { opacity:.5; }
  .ev .t { color:var(--accent); font-variant-numeric:tabular-nums; min-width:5.2em; font-size:.9rem; }
  .ev .name { flex:1; min-width:0; overflow-wrap:anywhere; }
  .ev .name small { display:block; color:var(--muted); }
  #msg { min-height:1.4em; margin-top:10px; font-size:.9rem; color:var(--muted); }
  #msg.err { color:var(--danger); }
  .empty { color:var(--muted); padding:8px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>Desk Companion events</h1>

<section id="setup" class="card" hidden>
  <strong>Sign in</strong>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" autocapitalize="off">
  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <div id="proj">
    <label for="apikey">Firebase Web API key (first time only)</label>
    <input id="apikey" autocapitalize="off" autocorrect="off">
  </div>
  <button class="add" id="signin">Sign in</button>
  <div id="loginmsg" class="err" style="min-height:1.4em;margin-top:10px;font-size:.9rem"></div>
</section>

<section id="main" hidden>
  <form id="form" class="card" autocomplete="off">
    <label for="title" style="margin-top:0">What</label>
    <input id="title" maxlength="39" required>
    <div class="row">
      <div><label for="date">Date</label><input id="date" type="date" required></div>
    </div>
    <div class="row">
      <div><label for="start">Starts</label><input id="start" type="time" required></div>
      <div><label for="end">Ends</label><input id="end" type="time" required></div>
    </div>
    <label for="loc">Where (optional)</label>
    <input id="loc" maxlength="31">
    <label for="notes">Notes (optional)</label>
    <input id="notes" maxlength="79">
    <button class="add" type="submit">Add event</button>
    <div id="msg" role="status"></div>
  </form>

  <h2>Coming up</h2>
  <div id="list"></div>
  <div style="margin-top:18px"><button class="plain" id="reset">Sign out</button></div>
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // Project settings for your Firebase project (not secrets: your data is protected by sign-in and the database rules).
  var DB_URL = "https://witlessdeskcompanion-default-rtdb.asia-southeast1.firebasedatabase.app";
  var API_KEY = "AIzaSyCo6qkLytx2HfkJ2yLnn6PR5SqayQ66Q7E";

  var cfg = null, events = [], idToken = "", tokenExp = 0;

  function store(op, k, v) {
    try { return op === "get" ? localStorage.getItem(k) : op === "del" ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { return null; }
  }
  function loadCfg() {
    // Optional: index.html#apikey=<key> saves the API key, then clears the address bar
    if (location.hash.length > 1) {
      var p = new URLSearchParams(location.hash.slice(1));
      if (p.get("apikey")) store("set", "dc_apikey", p.get("apikey"));
      history.replaceState(null, "", location.pathname);
    }
    return { apikey: API_KEY || store("get", "dc_apikey"), db: DB_URL.replace(/\/+$/, ""),
             refresh: store("get", "dc_refresh"), uid: store("get", "dc_uid") };
  }
  function signedIn() { return cfg && cfg.refresh && cfg.uid && cfg.apikey && cfg.db; }
  function base() { return cfg.db + "/users/" + encodeURIComponent(cfg.uid) + "/events"; }

  // A valid ID token (they last an hour), refreshed from the saved refresh token when needed
  function getToken() {
    if (idToken && Date.now() < tokenExp - 60000) return Promise.resolve(idToken);
    return fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(cfg.apikey), {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(cfg.refresh)
    }).then(function (r) { if (!r.ok) throw new Error("auth"); return r.json(); }).then(function (d) {
      idToken = d.id_token; tokenExp = Date.now() + (+d.expires_in) * 1000;
      return idToken;
    });
  }
  // fetch() against the database with the token attached
  function db(path, opts) {
    return getToken().then(function (t) { return fetch(base() + path + ".json?auth=" + encodeURIComponent(t), opts); });
  }
  function signOut() { ["dc_refresh", "dc_uid"].forEach(function (k) { store("del", k); }); idToken = ""; show(); }

  function say(text, err) { var m = $("msg"); m.textContent = text; m.className = err ? "err" : ""; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  function show() {
    cfg = loadCfg();
    var ok = signedIn();
    $("setup").hidden = ok;
    $("main").hidden = !ok;
    if (ok) { $("date").value = $("date").value || todayStr(); refresh(); }
    else {
      $("apikey").value = cfg.apikey || "";
      $("proj").hidden = !!cfg.apikey;   // only ask for the API key if we don't have it yet
    }
  }

  function refresh() {
    db("").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (data) {
      events = Object.keys(data || {}).map(function (id) { var e = data[id]; e.id = id; return e; })
        .sort(function (a, b) { return (a.date + a.start).localeCompare(b.date + b.start); });
      render();
    }).catch(function () {
      $("list").innerHTML = "";
      var d = document.createElement("div"); d.className = "empty";
      d.textContent = "Couldn't load events. Try again, or sign out and sign back in.";
      $("list").appendChild(d);
    });
  }

  function dayLabel(date) {
    var t = todayStr();
    if (date === t) return "Today";
    var d = new Date(date + "T12:00:00");
    return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
  }

  function render() {
    var list = $("list"), t = todayStr(), lastDate = "";
    list.innerHTML = "";
    if (!events.length) {
      var e0 = document.createElement("div"); e0.className = "empty"; e0.textContent = "No events yet. Add one above.";
      list.appendChild(e0); return;
    }
    events.forEach(function (ev) {
      if (ev.date !== lastDate) {
        lastDate = ev.date;
        var h = document.createElement("div"); h.className = "day"; h.textContent = dayLabel(ev.date);
        list.appendChild(h);
      }
      var row = document.createElement("div"); row.className = "ev" + (ev.date < t ? " past" : "");
      var tm = document.createElement("div"); tm.className = "t"; tm.textContent = ev.start + "–" + ev.end;
      var nm = document.createElement("div"); nm.className = "name"; nm.textContent = ev.title;
      if (ev.location) { var s = document.createElement("small"); s.textContent = ev.location; nm.appendChild(s); }
      var del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "Delete";
      del.addEventListener("click", function () {
        db("/" + encodeURIComponent(ev.id), { method: "DELETE" })
          .then(function (r) { if (!r.ok) throw 0; refresh(); })
          .catch(function () { say("Couldn't delete that event.", true); });
      });
      row.appendChild(tm); row.appendChild(nm); row.appendChild(del);
      list.appendChild(row);
    });
  }

  $("start").addEventListener("change", function () {
    if (!$("start").value || $("end").value) return;
    var p = $("start").value.split(":"), mins = Math.min(23 * 60 + 59, +p[0] * 60 + +p[1] + 60);
    $("end").value = pad(Math.floor(mins / 60)) + ":" + pad(mins % 60);
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if ($("end").value <= $("start").value) { say("The end time must be after the start time.", true); return; }
    var body = { title: $("title").value.trim(), date: $("date").value, start: $("start").value, end: $("end").value,
                 location: $("loc").value.trim(), notes: $("notes").value.trim() };
    say("Saving...");
    db("", { method: "POST", body: JSON.stringify(body) }).then(function (r) {
      if (!r.ok) throw 0;
      say("Added. It shows on the desk within a couple of minutes.");
      ["title", "start", "end", "loc", "notes"].forEach(function (id) { $(id).value = ""; });
      refresh();
    }).catch(function () { say("Couldn't save. Check your connection, or sign in again.", true); });
  });

  $("signin").addEventListener("click", function () {
    var email = $("email").value.trim(), pass = $("pass").value, apikey = $("apikey").value.trim();
    var m = $("loginmsg");
    if (!email || !pass || !apikey) { m.textContent = "Fill in your email, password and Firebase Web API key."; $("proj").hidden = false; return; }
    m.textContent = "";
    fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + encodeURIComponent(apikey), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: pass, returnSecureToken: true })
    }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      store("set", "dc_apikey", apikey);
      store("set", "dc_refresh", d.refreshToken); store("set", "dc_uid", d.localId);
      idToken = d.idToken; tokenExp = Date.now() + (+d.expiresIn) * 1000;
      $("pass").value = ""; show();
    }).catch(function () { m.textContent = "Couldn't sign in. Check your email, password and API key."; });
  });
  $("reset").addEventListener("click", signOut);

  show();
})();
</script>
</body>
</html>
